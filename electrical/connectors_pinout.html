<meta charset="utf-8"><body style="margin:0"><svg viewBox="0 0 1100 500" style="background:#fff" xmlns="http://www.w3.org/2000/svg"><style>.d{font:700 14px Inter,system-ui,sans-serif;fill:#111}.n{font:12px Inter,system-ui,sans-serif;fill:#333}.c{font:11px Inter,system-ui,sans-serif;fill:#555}.p{font:700 11px Inter,system-ui,sans-serif;fill:#111}</style><text x="30" y="36" class="d" text-anchor="start">Wrangler Air · распиновка разъёмов</text><text x="30" y="56" class="c" text-anchor="start">Вид на рабочую сторону (откуда вставляется ответная часть). Замок сверху. Папа = штыри ●, мама = гнёзда ○. Номера у мамы зеркальны папе: 1 мамы стыкуется с 1 папы.</text><text x="30" y="72" class="c" text-anchor="start">Правило: мама на той стороне, где остаётся напряжение при расстыковке, голых штырей под питанием нет.</text><text x="30" y="118" class="d" text-anchor="start">-X7 · 2P</text><text x="30" y="136" class="c" text-anchor="start">вход питания, хвост правого ввода</text><rect x="230" y="114" width="80" height="50" rx="8" fill="#f3f3f1" stroke="#111" stroke-width="1.5"/><rect x="256.0" y="105" width="28" height="9" rx="2" fill="#ddd" stroke="#111" stroke-width="1.2"/><circle cx="255.0" cy="139" r="8" fill="#fff" stroke="#111111" stroke-width="4"/><text x="255.0" y="178" class="p" text-anchor="middle">2</text><circle cx="285.0" cy="139" r="8" fill="#fff" stroke="#d42020" stroke-width="4"/><text x="285.0" y="178" class="p" text-anchor="middle">1</text><text x="230" y="102" class="n" text-anchor="start">мама: жгут машины (AUX1 / масса)</text><rect x="560" y="114" width="80" height="50" rx="8" fill="#f3f3f1" stroke="#111" stroke-width="1.5"/><rect x="586.0" y="105" width="28" height="9" rx="2" fill="#ddd" stroke="#111" stroke-width="1.2"/><circle cx="585.0" cy="139" r="8" fill="#d42020" stroke="#111" stroke-width="1"/><text x="585.0" y="178" class="p" text-anchor="middle">1</text><circle cx="615.0" cy="139" r="8" fill="#111111" stroke="#111" stroke-width="1"/><text x="615.0" y="178" class="p" text-anchor="middle">2</text><text x="560" y="102" class="n" text-anchor="start">папа: хвост коробки, за ним сплайсы -X2 / -X2a</text><rect x="870" y="108" width="14" height="12" fill="#d42020"/><text x="890" y="118" class="c" text-anchor="start">1  RD  +12 В после -F1</text><rect x="870" y="125" width="14" height="12" fill="#111111"/><text x="890" y="135" class="c" text-anchor="start">2  BK  масса 31</text><line x1="30" y1="212" x2="1070" y2="212" stroke="#ccc"/><text x="30" y="248" class="d" text-anchor="start">-X8 · 5P</text><text x="30" y="266" class="c" text-anchor="start">все выходы, хвост левого ввода</text><rect x="230" y="244" width="170" height="50" rx="8" fill="#f3f3f1" stroke="#111" stroke-width="1.5"/><rect x="301.0" y="235" width="28" height="9" rx="2" fill="#ddd" stroke="#111" stroke-width="1.2"/><circle cx="255.0" cy="269" r="8" fill="#fff" stroke="#e0a800" stroke-width="4"/><text x="255.0" y="308" class="p" text-anchor="middle">5</text><circle cx="285.0" cy="269" r="8" fill="#fff" stroke="#111111" stroke-width="4"/><text x="285.0" y="308" class="p" text-anchor="middle">4</text><circle cx="315.0" cy="269" r="8" fill="#fff" stroke="#d42020" stroke-width="4"/><text x="315.0" y="308" class="p" text-anchor="middle">3</text><circle cx="345.0" cy="269" r="8" fill="#fff" stroke="#ff7a00" stroke-width="4"/><text x="345.0" y="308" class="p" text-anchor="middle">2</text><circle cx="375.0" cy="269" r="8" fill="#fff" stroke="#7b2cbf" stroke-width="4"/><text x="375.0" y="308" class="p" text-anchor="middle">1</text><text x="230" y="232" class="n" text-anchor="start">мама: хвост коробки</text><rect x="560" y="244" width="170" height="50" rx="8" fill="#f3f3f1" stroke="#111" stroke-width="1.5"/><rect x="631.0" y="235" width="28" height="9" rx="2" fill="#ddd" stroke="#111" stroke-width="1.2"/><circle cx="585.0" cy="269" r="8" fill="#7b2cbf" stroke="#111" stroke-width="1"/><text x="585.0" y="308" class="p" text-anchor="middle">1</text><circle cx="615.0" cy="269" r="8" fill="#ff7a00" stroke="#111" stroke-width="1"/><text x="615.0" y="308" class="p" text-anchor="middle">2</text><circle cx="645.0" cy="269" r="8" fill="#d42020" stroke="#111" stroke-width="1"/><text x="645.0" y="308" class="p" text-anchor="middle">3</text><circle cx="675.0" cy="269" r="8" fill="#111111" stroke="#111" stroke-width="1"/><text x="675.0" y="308" class="p" text-anchor="middle">4</text><circle cx="705.0" cy="269" r="8" fill="#e0a800" stroke="#111" stroke-width="1"/><text x="705.0" y="308" class="p" text-anchor="middle">5</text><text x="560" y="232" class="n" text-anchor="start">папа: жгут: VT к ARB, OG к клапану, хвост датчика</text><rect x="870" y="238" width="14" height="12" fill="#7b2cbf"/><text x="890" y="248" class="c" text-anchor="start">1  VT  компрессор ARB (реле 2)</text><rect x="870" y="255" width="14" height="12" fill="#ff7a00"/><text x="890" y="265" class="c" text-anchor="start">2  OG  клапан +12 В (реле 1)</text><rect x="870" y="272" width="14" height="12" fill="#d42020"/><text x="890" y="282" class="c" text-anchor="start">3  RD  +5 В датчика</text><rect x="870" y="289" width="14" height="12" fill="#111111"/><text x="890" y="299" class="c" text-anchor="start">4  BK  GND датчика</text><rect x="870" y="306" width="14" height="12" fill="#e0a800"/><text x="890" y="316" class="c" text-anchor="start">5  YE  сигнал давления G13</text><line x1="30" y1="342" x2="1070" y2="342" stroke="#ccc"/><text x="30" y="370" class="c" text-anchor="start">Как стыкуется: 1 к 1, 2 к 2. На маме номер выбит на корпусе со стороны провода, на рабочей стороне он зеркальный, как на рисунке.</text><text x="30" y="388" class="c" text-anchor="start">-X8: сигнал YE в крайней ячейке 5, рядом только масса. +12 В (VT, OG) в ячейках 1-2, дальше всего от сигнала.</text><text x="30" y="406" class="c" text-anchor="start">Масса клапана не идёт через -X8: свой провод от катушки на шпильку у манифолда. -V3 1N4007 прямо на катушке.</text><text x="30" y="424" class="c" text-anchor="start">Набор герморазъёмов 1-6 pin, провод 0,5 мм² (20 AWG). Неиспользованных ячеек нет, заглушки не нужны.</text><text x="30" y="442" class="c" text-anchor="start">Мама и папа здесь по контактам: гнёзда или штыри. В наборе корпуса могут быть подписаны наоборот, смотреть на сами контакты.</text></svg>
