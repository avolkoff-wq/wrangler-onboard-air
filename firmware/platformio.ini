; PlatformIO build (optional, Arduino IDE works too). One build since 0.5.0: VALVE and DEMO are menu items
[platformio]
src_dir = wrangler_air

[env:dinmeter]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified
  h2zero/NimBLE-Arduino@^2.3.0
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

