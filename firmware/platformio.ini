; PlatformIO build for the same sketch (optional, Arduino IDE works too)
[platformio]
src_dir = wrangler_air

[env:dinmeter]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified

; desk test without sensor: virtual tyres respond to K1
[env:dinmeter-sim]
extends = env:dinmeter
build_flags = -DBENCH_SIM=1
