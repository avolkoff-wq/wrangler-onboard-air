; PlatformIO build for the same sketch (optional, Arduino IDE works too)
[platformio]
src_dir = wrangler_air

[env:dinmeter]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified

; desk test without sensor: virtual tyres respond to K1
[env:dinmeter-sim]
extends = env:dinmeter
build_flags = -DBENCH_SIM=1

; schematic A: 0-3.3 V sensor straight on G13 (PORT.A), no ADC, no divider
[env:dinmeter-direct]
extends = env:dinmeter
build_flags = -DSENSOR_DIRECT=1

; schematic A on the desk, no sensor
[env:dinmeter-direct-sim]
extends = env:dinmeter
build_flags = -DSENSOR_DIRECT=1 -DBENCH_SIM=1

; schematic C: 0-3.3 V sensor on G13 + Unit 2Relay: channel 1 (G2) compressor, channel 2 (G1) deflate valve
[env:dinmeter-deflate]
extends = env:dinmeter
build_flags = -DSENSOR_DIRECT=1 -DDEFLATE=1

; schematic C on the desk: virtual tyres answer the compressor and the valve
[env:dinmeter-deflate-sim]
extends = env:dinmeter
build_flags = -DSENSOR_DIRECT=1 -DDEFLATE=1 -DBENCH_SIM=1
