function buf(b64){const s=atob(b64),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer}
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(35,1,1,2000);
scene.add(new THREE.HemisphereLight(0xffffff,0x667080,0.75));
const d1=new THREE.DirectionalLight(0xffffff,0.75);d1.position.set(120,90,60);scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,0.35);d2.position.set(-80,40,-120);scene.add(d2);
const root=new THREE.Group();scene.add(root);
// STL: x = width, y = height, z = depth (front face z=0, back z=45). Show front towards -z.
const L=new THREE.STLLoader();
const matBody=new THREE.MeshStandardMaterial({color:0x3a4250,roughness:.7,metalness:.05,side:THREE.DoubleSide});
const matBack=new THREE.MeshStandardMaterial({color:0x7d8da3,roughness:.6,side:THREE.DoubleSide});
const body=new THREE.Mesh(L.parse(buf(BODY)),matBody);root.add(body);
const back=new THREE.Mesh(L.parse(buf(BACK)),matBack);
// cover sits on the open back: plate outside, lip pointing into the body
back.rotation.y=Math.PI;back.position.set(0,0,45+3);root.add(back);
const edges=(m,c)=>{const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,25),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.35}));m.add(e)};
edges(body,0x0b0e12);edges(back,0x1d2633);
// DinMeter mock-up (seen from -z: screen on the driver's left, knob on the right) (approx: front 53 x 30 x 5, body 45 x 22.5 x 27, knob on the right)
const din=new THREE.Group();root.add(din);
const mOr=new THREE.MeshStandardMaterial({color:0xe2602a,roughness:.55});
const fr=new THREE.Mesh(new THREE.BoxGeometry(53,30,5),mOr);fr.position.z=-2.5;din.add(fr);
const bd=new THREE.Mesh(new THREE.BoxGeometry(44.5,22,27),new THREE.MeshStandardMaterial({color:0xf2a37f,roughness:.8}));bd.position.z=13.5;din.add(bd);
const scr=new THREE.Mesh(new THREE.PlaneGeometry(26,15),new THREE.MeshStandardMaterial({color:0x0c0f12,roughness:.3}));scr.position.set(9,1,-5.05);scr.rotation.y=Math.PI;din.add(scr);
// DinMeter back clip (orange frame from the M5Stack kit), approximate from the photo: frame around the body
// right behind the front wall, two ears with brass threaded inserts on opposite corners. Measure the real part.
const clip=new THREE.Group();din.add(clip);
const mClip=new THREE.MeshStandardMaterial({color:0xf08a24,roughness:.6});

[[-1,1],[1,-1]].forEach(([sx,sy])=>{const ear=new THREE.Mesh(new THREE.BoxGeometry(8,8,8),mClip);ear.position.set(sx*27,sy*9.5,3+4);clip.add(ear);
  const ins=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,8.2,24),new THREE.MeshStandardMaterial({color:0xc9a227,metalness:.8,roughness:.3}));ins.rotation.x=Math.PI/2;ins.position.set(sx*27,sy*9.5,3+4);clip.add(ins)});
const knob=new THREE.Mesh(new THREE.CylinderGeometry(7,7,7,40),new THREE.MeshStandardMaterial({color:0xd8d8d8,roughness:.35,metalness:.4}));knob.rotation.x=Math.PI/2;knob.position.set(-15,0,-8.5);din.add(knob);
// screen digits as a tiny canvas texture
(function(){const c=document.createElement('canvas');c.width=260;c.height=150;const g=c.getContext('2d');g.fillStyle='#0c0f12';g.fillRect(0,0,260,150);g.fillStyle='#b6f34a';g.font='bold 84px monospace';g.textAlign='center';g.fillText('2.3',130,98);g.fillStyle='#9aa';g.font='22px sans-serif';g.fillText('bar',130,132);

root.position.set(0,0,-22);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;ctl.target.set(0,0,0);
const views={Right:[150,20,0],Front:[0,15,-150],Iso:[110,70,-110],Back:[0,20,150],OpenBack:[0,10,150],OpenIso:[105,75,115],Cover:[60,60,-60]};
let anim=null;
function go(n){const p=views[n];anim={from:cam.position.clone(),to:new THREE.Vector3(...p),t:0};
  document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',b.id==='v'+n));}
['Right','Front','Iso','Back','OpenBack','OpenIso','Cover'].forEach(n=>document.getElementById('v'+n).onclick=()=>{
  if(n==='Cover'){body.visible=false;cCover.checked=true;cExpl.checked=true;cDin.checked=false;apply();ctl.target.set(0,0,56)}
  else if(n.startsWith('Open')){body.visible=true;cCover.checked=false;apply();ctl.target.set(0,0,0)} else {body.visible=true;ctl.target.set(0,0,0);if(!cCover.checked||cExpl.checked){cCover.checked=true;cExpl.checked=false;cDin.checked=true;apply()}}
  go(n)});
cam.position.set(...views.Right);
const cCover=document.getElementById('cCover'),cExpl=document.getElementById('cExpl'),cDin=document.getElementById('cDin'),cX=document.getElementById('cXray');
function apply(){back.visible=cCover.checked;back.position.z=cExpl.checked?48+30:48;din.position.z=cExpl.checked?-30:0;din.visible=cDin.checked;
  matBody.transparent=cX.checked;matBody.opacity=cX.checked?.28:1;matBody.depthWrite=!cX.checked;}
[cCover,cExpl,cDin,cX].forEach(e=>e.onchange=apply);apply();
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(stage);size();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(){requestAnimationFrame(loop);
  if(anim){anim.t=Math.min(1,anim.t+(reduce?1:.06));const k=anim.t<.5?2*anim.t*anim.t:1-Math.pow(-2*anim.t+2,2)/2;cam.position.lerpVectors(anim.from,anim.to,k);if(anim.t>=1)anim=null}
  ctl.update();renderer.render(scene,cam)})();
